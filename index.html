<!doctype html>
<html lang="en" data-theme="system" data-accent="sage">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Daystream</title>
    <meta name="description" content="A calendar you can write in." />
    <meta name="theme-color" content="#F9F8F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daystream" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("daystream.theme") || "system";
          var accent = localStorage.getItem("daystream.accent") || "sage";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.accent = accent;
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#121211" : "#F9F8F6");
        } catch (error) {
          /* private mode: fall through to the stylesheet defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
